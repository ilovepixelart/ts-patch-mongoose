name: Feature request
description: Suggest an idea for ts-patch-mongoose
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is the problem or missing behavior?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you want to happen, for example a new plugin option, event, or history field.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or existing options you have tried.
