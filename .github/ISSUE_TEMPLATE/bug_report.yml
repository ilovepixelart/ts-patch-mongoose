name: Bug report
description: Something in ts-patch-mongoose is not working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not use this form for security issues. Report those privately via a [GitHub Security Advisory](https://github.com/ilovepixelart/ts-patch-mongoose/security/advisories/new); see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, and what went wrong? Include error messages and stack traces.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: For example, the patch document shape, the emitted event, or the stored history.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Schema definition, plugin options, and the query or operation that triggers the bug.
      render: typescript
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: ts-patch-mongoose, mongoose, Node.js, and OS
      placeholder: "ts-patch-mongoose 4.0.2, mongoose 9.4.1, Node 24.11, macOS 15"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Related issues, suspected hook interactions, TTL config, and so on.
