name: Scorecard

# OpenSSF Scorecard — weekly security-posture audit. Publishes results to the
# Scorecard API (badge at https://securityscorecards.dev/viewer/?uri=github.com/ilovepixelart/ts-patch-mongoose)
# and uploads a SARIF file to GitHub Code Scanning so any regressions show up
# on the Security tab.
#
# SARIF (Static Analysis Results Interchange Format) is the OASIS-standard JSON
# schema that GitHub Code Scanning ingests. Scorecard writes each failing check
# (Branch-Protection, Signed-Releases, Token-Permissions, Pinned-Dependencies,
# etc.) as a SARIF finding; GitHub then renders it as a code-scanning alert on
# the Security tab, annotates the offending file/line, and can gate merges via
# branch protection. Without the upload-sarif step the badge still works but
# findings never surface in the repo UI.

on:
  branch_protection_rule:
  schedule:
    - cron: '32 7 * * 1'
  push:
    branches:
      - main
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to GitHub code scanning
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1
        with:
          sarif_file: results.sarif
