name: Publish

on:
  release:
    types:
      - published

# Read by default; jobs upgrade to the minimal scopes they need.
permissions:
  contents: read

jobs:
  build:
    name: Build and hash
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
      tarball-name: ${{ steps.pack.outputs.tarball-name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type:check

      - name: Biome
        run: npm run biome

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Pack tarball
        id: pack
        run: |
          set -euo pipefail
          npm pack
          tarball=$(ls -1 ts-patch-mongoose-*.tgz | head -n1)
          echo "tarball-name=$tarball" >> "$GITHUB_OUTPUT"

      - name: Compute subject hashes for SLSA provenance
        id: hash
        run: |
          set -euo pipefail
          # generator_generic_slsa3 expects a base64-encoded sha256sum manifest:
          # base64("<hash>  <filename>\n...")
          hashes=$(sha256sum "${{ steps.pack.outputs.tarball-name }}" | base64 -w0)
          echo "hashes=$hashes" >> "$GITHUB_OUTPUT"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: npm-tarball
          path: ${{ steps.pack.outputs.tarball-name }}
          if-no-files-found: error
          retention-days: 1

  provenance:
    # SLSA generic generator — produces an *.intoto.jsonl attestation naming
    # the tarball hash as subject and uploads it to the triggering Release as
    # an asset. Scorecard's Signed-Releases check looks for exactly this file
    # next to the release assets.
    needs: [build]
    permissions:
      actions: read       # reusable workflow introspects run metadata
      id-token: write     # OIDC token for Sigstore keyless signing
      contents: write     # upload .intoto.jsonl to the triggering release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      upload-assets: true

  publish:
    name: Publish to npm
    needs: [build, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write     # npm provenance attestation via OIDC trusted publisher
    steps:
      - name: Use Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: Download tarball artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: npm-tarball

      - name: Publish to npm
        run: npm publish "${{ needs.build.outputs.tarball-name }}" --provenance --access public
