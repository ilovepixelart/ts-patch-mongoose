name: PR check

on:
  workflow_dispatch:
  # Pull requests, plus the commit each merge lands on main. Feature branches run
  # through their pull request only.
  push:
    branches:
      - main

  pull_request:
    types: [opened, synchronize, reopened]

# Declare default permissions as read only. No job in this workflow writes to
# the repo: tests, biome, type-check, coverage, and SonarCloud all run in
# read-only mode. SonarCloud PR decorations come from the SonarCloud GitHub
# App, not GITHUB_TOKEN write scopes.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
        mongoose-version: [mongoose@6.12.0, mongoose@6.13.13, mongoose@7.8.14, mongoose@8.24.10, mongoose@9.12.2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Disabling shallow clone is recommended for improving relevancy of reporting
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # No dependency install scripts; the one the tests need runs explicitly next.
      - name: Installing dependencies
        run: npm ci --ignore-scripts

      # Fetch the MongoDB binary once, before the parallel test workers race to
      # download it on first use.
      - name: Download the MongoDB binary
        run: node node_modules/mongodb-memory-server/postinstall.js

      # Deliberately outside the lockfile: each cell swaps in one supported mongoose major.
      - name: Installing ${{ matrix.mongoose-version }} # zizmor: ignore[adhoc-packages]
        env:
          MONGOOSE: ${{ matrix.mongoose-version }}
        run: npm i --ignore-scripts "$MONGOOSE"

      - name: Type check
        run: npm run type:check

      # In an order shuffled by the run's id, so a test that depends on another's state fails here;
      # the log prints the seed, and --sequence.seed=<seed> replays the order.
      - name: Coverage
        env:
          SEED: ${{ github.run_id }}
        run: npm run test -- --sequence.shuffle --sequence.seed="$SEED"

  sonar:
    name: Biome, Coverage & Sonar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: [26.x]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Disabling shallow clone is recommended for improving relevancy of reporting
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # No dependency install scripts; the one the tests need runs explicitly next.
      - name: Installing dependencies
        run: npm ci --ignore-scripts

      # Fetch the MongoDB binary once, before the parallel test workers race to
      # download it on first use.
      - name: Download the MongoDB binary
        run: node node_modules/mongodb-memory-server/postinstall.js

      - name: Verify provenance signatures
        run: npm audit signatures

      - name: Biome
        run: npm run biome

      - name: E2E tooling tests
        run: npm run test:e2e:tools

      - name: Type check tests
        run: npm run type:check:tests

      - name: Build
        run: npm run build

      # publint checks package.json against the files it ships; attw resolves the
      # packed types under every module resolution mode.
      - name: Package lint
        run: npm run lint:package

      - name: Coverage
        run: npm run test

      # Skipped when SONAR_TOKEN is absent (forks, Dependabot), so the check stays green there.
      - name: Scan
        if: env.SONAR_TOKEN
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=ilovepixelart
            -Dsonar.projectName=${{ github.event.repository.name }}
            -Dsonar.projectKey=ilovepixelart_${{ github.event.repository.name }}
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.test.exclusions=tests/**
            -Dsonar.coverage.exclusions=tests/**
            -Dsonar.qualitygate.wait=true

  # Packs the package, installs the tarball into fresh consumer projects next to the latest
  # published version, and fails on any behaviour difference allowlist.json does not list.
  e2e:
    name: E2E packed package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.x]
        mongoose-version: [mongoose@6.12.0, mongoose@6.13.13, mongoose@7.8.14, mongoose@8.24.10, mongoose@9.12.2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Installing dependencies
        run: npm ci --ignore-scripts

      # The consumer projects install this mongoose version; the repository keeps its own.
      - name: E2E with ${{ matrix.mongoose-version }}
        env:
          MONGOOSE: ${{ matrix.mongoose-version }}
        run: npm run test:e2e -- --mongoose "$MONGOOSE"

  # The proofs of laws/ (npm run laws): Bend checks them, and --verdict rechecks them with BendTT's
  # kernel, which Lean builds. Both toolchains are pinned and checked against the release digests.
  # Required by the CI job below. The proofs and the generated modules depend on laws/, the toolchain
  # this job pins and the laws scripts, so a pull request that changes none of them skips the check;
  # main and manual runs check always.
  laws:
    name: Laws (Bend proofs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      BEND_VERSION: 2.0.40
      BEND_SHA256: c9ff8d67bd903fb6ad9a26b43d8a62c01021de82a44d55ce4a3dcd4732113d6b
      LEAN_VERSION: 4.34.0
      LEAN_SHA256: caaa98356098c85dc0fcbbd28e1ec66f39eb6551829972b752ff20e1286b646b
      # bend otherwise asks bend-lang.com for its latest version once a day
      BEND_NO_TELEMETRY: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Changes under laws/
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [ -n "$(git diff --name-only "$BASE" HEAD -- laws/ .github/workflows/pr-check.yaml)" ] || git diff "$BASE" HEAD -- package.json | grep -q '^[-+] *"laws'; then
            echo "check=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing under laws/, in this workflow or in the laws scripts changed: the proofs and the generated modules are as on the base."
            echo "check=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Use Node.js 24.x
        if: steps.changes.outputs.check == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x

      # What bend-lang.com/install.sh does, at a pinned version: the release archive, its digest, ~/.bend.
      - name: Install Bend ${{ env.BEND_VERSION }}
        if: steps.changes.outputs.check == 'true'
        run: |
          set -euo pipefail
          archive="bend-${BEND_VERSION}-linux-x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/bendlang/bend/releases/download/v${BEND_VERSION}/$archive"
          echo "${BEND_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          mkdir -p "$HOME/.bend/bin"
          mv "$RUNNER_TEMP/bend/bend2" "$RUNNER_TEMP/bend/guide" "$HOME/.bend/"
          mv "$RUNNER_TEMP/bend/bin/bend" "$HOME/.bend/bin/bend"

      - name: Install Lean ${{ env.LEAN_VERSION }}
        if: steps.changes.outputs.check == 'true'
        run: |
          set -euo pipefail
          archive="lean-${LEAN_VERSION}-linux.tar.zst"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/leanprover/lean4/releases/download/v${LEAN_VERSION}/$archive"
          echo "${LEAN_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/lean"
          tar --zstd -xf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/lean" --strip-components=1
          echo "$RUNNER_TEMP/lean/bin" >> "$GITHUB_PATH"

      - name: Check the laws
        if: steps.changes.outputs.check == 'true'
        run: npm run laws

  zizmor:
    name: Workflow audit (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Audit workflows
        run: uvx zizmor@1.32.0 --format=plain --config .github/zizmor.yml .github

  # The one check branch rules require: it fails unless every job above succeeded.
  ci:
    name: CI
    needs: [tests, sonar, e2e, laws, zizmor]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            echo "Jobs that did not succeed:" >&2
            echo "$failed" >&2
            exit 1
          fi
          echo "All jobs succeeded."
